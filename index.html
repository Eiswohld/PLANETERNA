<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solaris</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.ico">
</head>
<body>

<header>
  <h1>SOLSYSTEMET</h1>
  <h3>SOLARIS</h3>
</header>

<main>
  <section class="hero">
    <nav class="planet-nav">
      <ul class="planets">
        <li><button class="planet" data-index="0" aria-label="Solen"></button></li>
        <li><button class="planet" data-index="1" aria-label="Merkurius"></button></li>
        <li><button class="planet" data-index="2" aria-label="Venus"></button></li>
        <li><button class="planet" data-index="3" aria-label="Jorden"></button></li>
        <li><button class="planet" data-index="4" aria-label="Mars"></button></li>
        <li><button class="planet" data-index="5" aria-label="Jupiter"></button></li>
        <li><button class="planet" data-index="6" aria-label="Saturnus"></button></li>
        <li><button class="planet" data-index="7" aria-label="Uranus"></button></li>
        <li><button class="planet" data-index="8" aria-label="Neptunus"></button></li>
      </ul>
    </nav>
  </section>
</main>

<section id="overlay" class="hidden">
  <button id="closeOverlay">Stäng</button>
  <h2 id="overlayTitle">Planetnamn</h2>
  <p id="overlayText">...</p>
</section>

<script src="script.js"></script>
</body>
</html>
